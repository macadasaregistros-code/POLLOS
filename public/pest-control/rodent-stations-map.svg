<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 779" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de estaciones de control de roedores</title>
  <desc id="desc">Plano ilustrado de la granja con galpones, casa, bodega, lago y quebrada.</desc>
  <defs>
